name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only by default: only the release job below can write, so a third-party
# action in the quality gates never holds a token able to rewrite a release.
permissions:
  contents: read

env:
  # Same version as the `toolchain` line of go.mod (a test keeps them in sync):
  # the stdlib compiled into the release binaries carries its security fixes.
  GO_VERSION: '1.26.10'
  BINARY: todo-activity-report

jobs:
  # The four gates run in parallel: a red one blocks the release jobs below.
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [format, vet, lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gofmt
        if: matrix.check == 'format'
        run: test -z "$(gofmt -l .)" || { echo "gofmt needed — run 'gofmt -w .':"; gofmt -l .; exit 1; }

      - name: go vet
        if: matrix.check == 'vet'
        run: go vet ./...

      - name: golangci-lint
        if: matrix.check == 'lint'
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.2

      - name: go test
        if: matrix.check == 'test'
        run: |
          go test -race -coverpkg=./... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tail -1

  # One job for the four targets: pure Go (stdlib, no cgo), so cross-compiling
  # needs no C toolchain.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build every target
        run: |
          mkdir -p dist
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            GOOS="${target%-*}" GOARCH="${target#*-}" \
              go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o "dist/${BINARY}-${target}" ./cmd/${BINARY}
          done
          cd dist && sha256sum ${BINARY}-* > SHA256SUMS && cat SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          body: "${{ env.BINARY }} ${{ github.ref_name }} — binaires autonomes (stdlib, statiquement liés)."
